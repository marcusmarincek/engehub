<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Hub de Cálculos</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181D; --panel:#191E25; --line:#2B3340; --ink:#E8E6E0; --ink-dim:#9AA4B2;
    --brass:#10B6B6; --brass-dim:#0C8A8A; --red:#C15C4E; --input-bg:#12161C;
  }
  :root[data-theme="light"]{
    --bg:#F4F7F7; --panel:#FFFFFF; --line:#D6E0E0; --ink:#1A2323; --ink-dim:#5B6B6B;
    --brass:#10B6B6; --brass-dim:#0C8A8A; --red:#B23D30; --input-bg:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;
  }
  .card{
    width:340px; background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:32px 28px;
  }
  .mark{
    width:38px;height:38px;border:1.5px solid var(--brass);border-radius:3px;
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    color:var(--brass);font-weight:600;margin-bottom:16px;
  }
  h1{font-size:17px;margin:0 0 4px;}
  p.sub{color:var(--ink-dim);font-size:12.5px;margin:0 0 24px;}
  label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px;}
  input{
    width:100%;background:var(--input-bg);border:1px solid var(--line);color:var(--ink);
    padding:9px 10px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:13px;
    margin-bottom:16px;
  }
  input:focus{outline:none;border-color:var(--brass);}
  button{
    width:100%;background:var(--brass-dim);border:1px solid var(--brass);color:#fff;
    padding:10px;border-radius:3px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  button:hover{background:var(--brass);}
  .err{color:var(--red);font-size:12.5px;margin:-8px 0 14px;display:none;}
</style>
</head>
<body>
<script>
(function(){ try { var t = localStorage.getItem('hub-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){} })();
</script>
  <form class="card" id="login-form" autocomplete="on">
    <div class="mark">HC</div>
    <h1>Hub de Cálculos</h1>
    <p class="sub">Acesso restrito. Entre com seu usuário e senha.</p>
    <label for="username">Usuário</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">Senha</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <div class="err" id="err">Usuário ou senha inválidos.</div>
    <button type="submit">Entrar</button>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const err = document.getElementById('err');
      err.style.display = 'none';
      try {
        const res = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) { window.location.href = '/hub.html'; }
        else { err.style.display = 'block'; }
      } catch (e2) { err.textContent = 'Erro de conexão com o servidor.'; err.style.display = 'block'; }
    });
  </script>
</body>
</html>
