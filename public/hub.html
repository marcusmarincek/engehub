<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub de Cálculos</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181D; --panel:#191E25; --raised:#1F2530; --line:#2B3340; --ink:#E8E6E0; --ink-dim:#9AA4B2; --ink-faint:#5E6A79;
    --brass:#10B6B6; --brass-dim:#0C8A8A;
  }
  :root[data-theme="light"]{
    --bg:#F4F7F7; --panel:#FFFFFF; --raised:#EDF3F3; --line:#D6E0E0; --ink:#1A2323; --ink-dim:#5B6B6B; --ink-faint:#8A9999;
    --brass:#10B6B6; --brass-dim:#0C8A8A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;}
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 30px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .mark{
    width:30px;height:30px;border:1.5px solid var(--brass);border-radius:2px;
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    color:var(--brass);font-weight:600;font-size:12px;
  }
  header h1{font-size:15px;margin:0;font-weight:600;}
  .header-right{display:flex;align-items:center;gap:10px;}
  #who{color:var(--ink-faint);font-size:12px;}
  #logout,#theme-toggle{
    background:none;border:1px solid var(--line);color:var(--ink-dim);padding:6px 12px;
    border-radius:3px;font-size:12px;cursor:pointer;
  }
  #logout:hover,#theme-toggle:hover{border-color:var(--brass);color:var(--ink);}
  main{padding:30px;max-width:1100px;margin:0 auto;}
  main > p{color:var(--ink-faint);font-size:13px;margin-bottom:24px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  a.appcard{
    display:block;background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:20px;text-decoration:none;color:var(--ink);transition:border-color .15s;
  }
  a.appcard:hover{border-color:var(--brass);}
  .appcard .icon{font-size:26px;margin-bottom:12px;display:block;}
  .appcard h2{font-size:14.5px;margin:0 0 6px;font-weight:600;}
  .appcard p{font-size:12px;color:var(--ink-dim);margin:0;line-height:1.5;}
  .empty{color:var(--ink-faint);font-size:13px;padding:40px 0;text-align:center;border:1px dashed var(--line);border-radius:4px;}
</style>
</head>
<body>
<script>
(function(){ try { var t = localStorage.getItem('hub-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){} })();
</script>
  <header>
    <div class="brand"><div class="mark">HC</div><h1>Hub de Cálculos</h1></div>
    <div class="header-right"><span id="who"></span><button id="theme-toggle" title="Alternar tema claro/escuro">🌗</button><button id="logout">Sair</button></div>
  </header>
  <main>
    <p>Selecione um aplicativo. Cada um mantém seus próprios projetos, salváveis em qualquer pasta do servidor.</p>
    <div class="grid" id="apps"></div>
  </main>
  <script>
    (async () => {
      const who = await fetch('/api/whoami').then(r => r.json());
      if (!who.authed) { window.location.href = '/login.html'; return; }
      document.getElementById('who').textContent = who.username;
      const apps = await fetch('/api/apps').then(r => r.json());
      const grid = document.getElementById('apps');
      if (!apps.length) {
        grid.innerHTML = '<div class="empty">Nenhum app cadastrado ainda.</div>';
      } else {
        grid.innerHTML = apps.map(a => `
          <a class="appcard" href="${a.path}">
            <span class="icon">${a.icon || '⚙️'}</span>
            <h2>${a.name}</h2>
            <p>${a.description || ''}</p>
          </a>`).join('');
      }
    })();
    document.getElementById('logout').onclick = async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };
    document.getElementById('theme-toggle').onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('hub-theme', next); } catch (e) {}
    };
  </script>
</body>
</html>
